<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>格朗德 · 特效工作台</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101a26;color:#ebeced;font:14px/1.5 "Segoe UI","Microsoft YaHei",sans-serif}#scene{position:fixed;inset:0 310px 98px 0}aside{position:fixed;right:0;top:0;bottom:0;width:310px;background:#12202eeF;border-left:1px solid #3e5364;padding:24px;overflow:auto}h1{font-size:22px;margin:0 0 5px}h2{font-size:13px;color:#d8b982;margin:26px 0 10px;font-weight:600;letter-spacing:.08em}p{color:#acbac8;font-size:12px;margin:5px 0 17px}label.field{display:block;color:#aebdcc;font-size:12px;margin:13px 0}select{display:block;width:100%;margin-top:6px}button,select{color:#edf3f6;background:#213344;border:1px solid #516577;border-radius:5px;padding:9px 11px;font:inherit}button{cursor:pointer}button:hover{background:#304b5e}button.primary{background:#d0b477;color:#17212b;border-color:#ddc18a}.toggles{display:grid;grid-template-columns:1fr 1fr;gap:11px 8px}.toggles label{font-size:12px;color:#d2dde5;display:flex;align-items:center;gap:6px}input{accent-color:#d7b675}footer{position:fixed;left:0;right:310px;bottom:0;height:98px;background:#101c29ed;border-top:1px solid #3e5364;padding:12px 22px}footer .row{display:flex;gap:9px;align-items:center}#scrub{width:100%;margin:8px 0}#clock{font:13px monospace;color:#e9d6b1;margin-left:auto}#details{font-size:12px;color:#b6c6d4;white-space:pre-wrap;overflow-wrap:anywhere}.tag{color:#bfa574;font-size:10px;letter-spacing:.18em}a{color:#adc7dc}#frame-note{position:absolute;left:20px;top:18px;font-size:12px;color:#c6d2de;pointer-events:none}#error{color:#ffb4a4}button:focus-visible,select:focus-visible{outline:2px solid #ffe0a3;outline-offset:3px}@media(max-width:850px){aside{width:250px;padding:16px}#scene{right:250px}footer{right:250px;padding:10px}h1{font-size:18px}footer button{padding:8px}}
footer button{white-space:nowrap;flex-shrink:0}#speed{width:88px;flex:0 0 88px;margin:0}#clock{white-space:nowrap;flex-shrink:0}
</style></head><body>
<div id="scene"><div id="frame-note">拖动旋转 · 滚轮缩放 · 空格播放 / 暂停</div></div>
<aside><span class="tag">GRANDE / EFFECT STUDIO</span><h1>特效工作台</h1><p>使用真实技能事件。独立临时状态，不读取或写入游戏存档。</p>
<label class="field">角色<select id="hero"></select></label><label class="field">技能<select id="skill"></select></label>
<label class="field">持续状态<select id="status"><option value="none">普通待机</option><option value="ready">角色就绪状态</option><option value="positive">雷克 · 正域</option><option value="negative">雷克 · 负域</option><option value="chaos">雷克 · 混沌 + 正域</option><option value="captain">游墓 · 船长接管</option><option value="dead">倒下 / 状态取消</option></select></label>
<label class="field">受击材质<select id="boss"><option value="duelist">金属 · 折镜刃卫</option><option value="golem">岩石 · 魔晶巨人</option><option value="cantor">有机 · 孢冠司祭</option><option value="weaver">纸页 · 缄页织者</option><option value="orrery">水晶 · 星轨测绘仪</option></select></label>
<h2>显示分层</h2><div class="toggles" id="layers"></div>
<h2>镜头与回放</h2><div class="toggles"><label><input id="loop" type="checkbox" checked>循环</label><label><input id="motion" type="checkbox">减少动态</label><label><input id="environment" type="checkbox" checked>场景</label><label><input id="numbers" type="checkbox">伤害数字</label></div>
<p style="margin-top:15px">定格会从相同种子重新演算到指定时间；分层只影响显示。状态从选择的样本持续显示，技能不会永久改变样本。</p><p id="cost" aria-live="off"></p><div id="details"></div><p id="error" role="status"></p><p><a href="./">返回游戏</a></p></aside>
<footer><div class="row"><button class="primary" id="replay">重播</button><button id="play">暂停</button><button id="step" title="前进一帧">+1 帧</button><select id="speed" aria-label="速度"><option value=".25">0.25×</option><option value=".5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select><output id="clock">0.00 / 3.00s</output></div><input id="scrub" type="range" min="0" max="3" step=".0166667" value="0" aria-label="定格时间"></footer>
<script type="module" src="/src/vfx-lab.js"></script></body></html>
